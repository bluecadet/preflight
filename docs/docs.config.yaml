        - label: license
          href: https://github.com/bluecadet/preflight/blob/main/LICENSE
        - label: contributing guide
          href: https://github.com/bluecadet/preflight/blob/main/CONTRIBUTING.md
    - title: Bluecadet
      links:
        - label: bluecadet.com
          href: https://bluecadet.com
          note: bluecadet.com
        - label: launchpad
          href: https://launchpad.bluecadet.com
