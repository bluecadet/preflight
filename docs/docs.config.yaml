glyph: "✓"
accent: "#8fb4d6"
accent2: "#d98a6e"

site: https://preflight.bluecadet.com

landing: index.mdx

content:
  - files:
      - "tutorials/**/*.md"
      - "how-to/**/*.md"
      - "reference/**/*.md"
      - "explanation/**/*.md"
      - "development/**/*.md"
  - base: ".."
