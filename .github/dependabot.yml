version: 2

# Batch supported dependency ecosystems into one weekly version-update PR.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    groups:
      go-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
