name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - "!docs/reference/modules.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - "!docs/reference/modules.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      build: ${{ steps.filter.outputs.build }}
      posix: ${{ steps.filter.outputs.posix }}
      docs_matrix: ${{ steps.filter.outputs.docs_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - '**/*.go'
              - go.mod
              - go.sum
              - .golangci.yml
              - .golangci.yaml
              - .golangci.toml
              - .golangci.json
              - Makefile
              - .github/workflows/ci.yml
            posix:
              - 'test/posix/**'
              - .github/workflows/ci.yml
            docs_matrix:
              - 'docs/reference/modules.md'
              - .github/workflows/ci.yml
            build:
              - '**/*.go'
              - go.mod
              - go.sum
              - Makefile
              - install.sh
              - install.ps1
              - .goreleaser.yaml
              - .github/workflows/ci.yml
              - .github/workflows/release.yml

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.docs_matrix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test -race ./...

  test-windows:
    name: Test (Windows)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        # -race needs cgo and a C toolchain; windows-latest ships mingw.
        run: go test -race ./...

  test-posix-integration:
    name: POSIX Integration (${{ matrix.container }})
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.posix == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ubuntu
            port: "2222"
            service: ubuntu
          - container: rocky
            port: "2223"
            service: rocky
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build and start ${{ matrix.container }} container
        working-directory: test/posix
        run: docker compose up -d --build ${{ matrix.service }}

      - name: Wait for sshd
        working-directory: test/posix
        run: sh wait-for-ssh.sh localhost ${{ matrix.port }} 90

      - name: Run POSIX integration tests
        env:
          PREFLIGHT_TEST_SSH_POSIX_HOST: localhost
          PREFLIGHT_TEST_SSH_POSIX_PORT: ${{ matrix.port }}
          PREFLIGHT_TEST_SSH_POSIX_USER: pf-admin
          PREFLIGHT_TEST_SSH_POSIX_PASS: preflight
        run: go test -tags integration -count=1 -run TestIntegration_POSIX -v ./internal/target/

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: go tool golangci-lint run

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: preflight-windows-amd64.exe
          - goos: windows
            goarch: arm64
            output: preflight-windows-arm64.exe
          - goos: darwin
            goarch: amd64
            output: preflight-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: preflight-darwin-arm64
          - goos: linux
            goarch: amd64
            output: preflight-linux-amd64
          - goos: linux
            goarch: arm64
            output: preflight-linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o dist/${{ matrix.output }} .
