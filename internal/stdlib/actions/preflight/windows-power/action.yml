name: preflight/windows-power
version: "3.1.0"
description: Configure Windows power plans, screen saver, and hibernation settings
author: preflight

inputs:
  user:
    type: string
    default: ""
    description: Optional Windows user whose screen saver preferences to configure (profile loaded on demand)
  plan_name:
    type: string
    default: Preflight Exhibit
    description: Friendly name for the managed power plan
  plan_base:
    type: string
    default: balanced
    description: Base power plan alias or GUID to clone
  activate_plan:
    type: bool
    default: true
    description: Activate the managed plan after applying it
  display_timeout_ac:
    type: int
    default: 0
    description: Display idle timeout on AC power in minutes
  display_timeout_dc:
    type: int
    default: 0
    description: Display idle timeout on DC power in minutes
  sleep_timeout_ac:
    type: int
    default: 0
    description: Sleep idle timeout on AC power in minutes
  sleep_timeout_dc:
    type: int
    default: 0
    description: Sleep idle timeout on DC power in minutes
  disable_screensaver:
    type: bool
    default: true
    description: Disable the Windows screen saver for the selected user
  disable_hibernation:
    type: bool
    default: false
    description: Disable Windows hibernation and remove hiberfil.sys

tasks:
  - name: Configure power plan
    power_plan:
      name: "{{ vars.plan_name }}"
      base: "{{ vars.plan_base }}"
      activate: "{{ vars.activate_plan }}"
      settings:
        - subgroup: SUB_VIDEO
          setting: VIDEOIDLE
          ac_value: "{{ vars.display_timeout_ac }}"
          dc_value: "{{ vars.display_timeout_dc }}"
        - subgroup: SUB_SLEEP
          setting: STANDBYIDLE
          ac_value: "{{ vars.sleep_timeout_ac }}"
          dc_value: "{{ vars.sleep_timeout_dc }}"
      ensure: present

  - name: Disable screen saver
    when: "{{ vars.disable_screensaver }}"
    registry:
      path: 'HKCU:\Control Panel\Desktop'
      user: "{{ vars.user }}"
      values:
        - name: ScreenSaveActive
          type: string
          data: "0"
        - name: SCRNSAVE.EXE
          ensure: absent

  - name: Enable screen saver
    when: "{{ vars.disable_screensaver == 'false' }}"
    registry:
      path: 'HKCU:\Control Panel\Desktop'
      user: "{{ vars.user }}"
      values:
        - name: ScreenSaveActive
          type: string
          data: "1"

  - name: Configure hibernation
    when: "{{ vars.disable_hibernation }}"
    powershell:
      check_script: |
        $disable = [System.Convert]::ToBoolean('{{ vars.disable_hibernation }}')
        $powerKey = 'HKLM:\SYSTEM\CurrentControlSet\Control\Power'
        $prop = Get-ItemProperty -LiteralPath $powerKey -Name HibernateEnabled -ErrorAction SilentlyContinue
        $isEnabled = ($null -ne $prop -and $prop.HibernateEnabled -eq 1)
        if ($disable) {
          return ($isEnabled -eq $true)
        }
        return ($isEnabled -ne $true)
      script: |
        $disable = [System.Convert]::ToBoolean('{{ vars.disable_hibernation }}')
        if ($disable) {
          & powercfg.exe /h off
          Write-Output 'Hibernation disabled and hiberfil.sys removed'
        } else {
          & powercfg.exe /h on
          Write-Output 'Hibernation enabled'
        }
